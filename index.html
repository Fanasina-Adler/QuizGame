<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz</title>
</head>

<body class="">
    <div class="container">
        <div id="accueil">
            <div class="mode">
                <div id="timer">
                </div>
                <button id="accmodebtn">&#9728;</button>
            </div>
            <h1><span id="titre">Quiz</span><span id="game">Game</span></h1>
            <h2>Bienvenue dans le quiz !</h2>
            <p>Choisissez le catégorie :</p>
            <select name="categorie" id="categorie">
                <option value="Général">Général</option>
                <option value="Technologie">Technologie</option>
                <option value="Histoire">Histoire</option>
                <option value="Science">Science</option>
            </select>
            <button id="startbtn" class="btn" onclick="startQuiz()">Commencer</button>
        </div>
        <div id="quiz" style="display: none;">
            <div class="mode">
                <div id="timer">
                    <span id="sec">15</span>
                </div>
                <button id="modebtn">&#9728;</button>
            </div>
            <h2 id="quizQuestion"></h2>
            <div id="quizOptions"></div>
            <button id="nextbtn" class="btn">Suivant <div id="after"></div></button>
            <!-- <div class="bonus">+1</div> -->
        </div>
        <div id="resultat" style="display: none;">
            <div class="mode">
                <div></div>
                <button id="resmodebtn">&#9728;</button>
            </div>
            <h1>Résultat</h1>
            <h2 id="rescategorie"></h2>
            <p id="mention"></p>
            <p>Score : <span id="score"></span></p>
            <button id="restart" class="btn" onclick="location.reload()">Recommencer</button>
            <canvas id="fireworksCanvas"></canvas>
        </div>
        <p id="copy">&copy; Fanasina ft Rindra</p>
    </div>
    <script src="firework.js"></script>
    <script src="script.js"></script>
</body>
</html>
